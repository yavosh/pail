\* Crash safety: writers and lifecycle expiry, two crashes (so one can hit recovery), failed commits.
\* Readers do not change files, so this config leaves them out.
CONSTANTS
    MaxIds = 4
    MaxCrashes = 2
    MaxOpen = 3
    Locked = TRUE
    SweepLocked = TRUE
    CommitFails = TRUE
    LookupReaders = {}
    ListReaders = {}
SPECIFICATION Spec
INVARIANTS TypeOK KeyHasCurrent RecordsHaveBlobs AtRest
