name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets, so a stacked PR based on another
  # feature branch gets the same checks as one based on main.
  pull_request:

# A newer push to the same branch supersedes any run already in flight —
# without this, rapid pushes queue fully-stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The race detector triples test time, so pull requests run without it. Every
# push to main runs it.
env:
  RACE: ${{ github.event_name == 'push' && '-race' || '' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned for reproducible CI; bump deliberately (keep in sync with local installs).
          version: v2.13.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          # shellcheck disable=SC2086
          go test $RACE -count=1 ./...
