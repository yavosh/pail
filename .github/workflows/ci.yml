name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets, so a stacked PR based on another
  # feature branch gets the same checks as one based on main.
  pull_request:

# A newer push to the same branch supersedes any run already in flight —
# without this, rapid pushes queue fully-stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The race detector triples test time, so pull requests run without it. Every
# push to main runs it.
env:
  RACE: ${{ github.event_name == 'push' && '-race' || '' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Check the binary does not link the AWS SDK
        run: |
          if go list -deps ./cmd/pail | grep -E 'aws|smithy'; then
            echo "cmd/pail depends on the AWS SDK; it must stay a test-only dependency"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned for reproducible CI; bump deliberately (keep in sync with local installs).
          version: v2.13.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          # shellcheck disable=SC2086
          go test $RACE -count=1 ./...

  # The AWS CLI and boto3 differ from aws-sdk-go-v2 in their defaults, so run
  # both against a real pail process. The boto3 pin keeps the job reproducible.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install boto3
        run: pip install boto3==1.42.97

      - name: Show the AWS CLI version
        run: aws --version

      - name: Smoke test
        run: scripts/smoke.sh

  # The image is what most users run, so build it and start it the way the
  # README says. The container healthcheck and the AWS CLI both have to pass.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: pail:ci

      - name: Run the image
        run: |
          docker run -d --name pail -p 9000:9000 \
            -e PAIL_ACCESS_KEY_ID=AKIAPAILSMOKETEST000 \
            -e PAIL_SECRET_ACCESS_KEY=pail-smoke-secret \
            pail:ci

      - name: Wait for the container healthcheck
        run: |
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' pail)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            # An exited container never becomes healthy, so stop waiting.
            [ "$(docker inspect -f '{{.State.Running}}' pail)" = true ] || break
            sleep 2
          done
          echo "container is not healthy; last status: $status"
          exit 1

      - name: Show the AWS CLI version
        run: aws --version

      - name: AWS CLI smoke test
        env:
          SMOKE_ENDPOINT: http://127.0.0.1:9000
          SMOKE_ACCESS_KEY: AKIAPAILSMOKETEST000
          SMOKE_SECRET_KEY: pail-smoke-secret
        run: scripts/smoke-awscli.sh

      - name: Show the container log
        if: failure()
        run: docker logs pail
